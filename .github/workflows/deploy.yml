name: Deploy Web App to GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Build C++ & WASM"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Frontend & Deploy to GitHub Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Download & Preprocess CSV Data
        run: |
          # Build the fetch tool, download data, then clean it
          make data/fetchData
          ./data/fetchData
          make preprocess INPUT=data/data.csv OUTPUT=data/data_clean.csv REPORT=build/preprocessing_report.json
          # Copy cleaned CSV to web/public so the frontend can fetch it
          mkdir -p web/public
          cp data/data_clean.csv web/public/data_clean.csv

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: web/public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: |
          cd web
          pnpm install

      - name: Build Web Application
        run: |
          cd web
          pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
