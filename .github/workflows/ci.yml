name: CI - Build C++ & WASM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native:
    name: Compile & Test C++ (Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Verify C++ Compilation
        run: |
          make build/cleanData
          make test-search
          make test-wasm-bridge
          make test-preprocess
          g++ -Wall -Wextra -std=c++17 main.cpp -o programa

  build-wasm:
    name: Compile C++ to WebAssembly
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten Installation
        run: emcc -v

      - name: Compile to WASM
        run: |
          mkdir -p web/public
          make wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check Web Frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
